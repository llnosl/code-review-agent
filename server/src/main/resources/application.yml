spring:
  application:
    name: code-review-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/code_review}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

agent:
  base-url: ${AGENT_BASE_URL:http://localhost:3001}
  review-path: ${AGENT_REVIEW_PATH:/api/reviews}

review:
  submission-dispatch:
    interval-millis: ${REVIEW_SUBMISSION_INTERVAL_MILLIS:1000}
    batch-size: ${REVIEW_SUBMISSION_BATCH_SIZE:20}
    lease-duration: ${REVIEW_SUBMISSION_LEASE_DURATION:PT1M}
    max-attempts: ${REVIEW_SUBMISSION_MAX_ATTEMPTS:8}
    initial-retry-delay: ${REVIEW_SUBMISSION_INITIAL_RETRY_DELAY:PT5S}
    max-retry-delay: ${REVIEW_SUBMISSION_MAX_RETRY_DELAY:PT10M}
