spring:
  application:
    name: code-review-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/code_review}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

agent:
  base-url: ${AGENT_BASE_URL:http://localhost:3001}
